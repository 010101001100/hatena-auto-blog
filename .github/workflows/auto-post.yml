name: Hatena Auto Blog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Asia/Tokyo'

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post article
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          BLOG_THEME: ${{ vars.BLOG_THEME }}
          BLOG_SYNTAX: ${{ vars.BLOG_SYNTAX }}
          BLOG_CATEGORIES: ${{ vars.BLOG_CATEGORIES }}
          HATENA_DRAFT: "false"
          DRY_RUN: "false"
        run: python main.py
