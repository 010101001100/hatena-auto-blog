name: Hatena Auto Blog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8,20 * * *'
      timezone: 'Asia/Tokyo'

concurrency:
  group: hatena-auto-blog
  cancel-in-progress: true

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Research, write, review and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}

          BLOG_THEME: ${{ vars.BLOG_THEME }}
          USE_GOOGLE_SEARCH: "false"
          RESEARCH_MODEL: "gemini-3.8-flash"
          WRITER_MODEL: "gemini-3.8-flash"
          CRITIC_MODEL: "gemini-3.8-flash"

          HATENA_DRAFT: "false"
          # 手動実行はテストのみ。定期実行だけ公開する。
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python quality_entry.py
