name: Hatena Auto Blog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - quality_gate.py
      - article_checks.py
      - tests/**
      - official_sources.py
      - quality_runner.py
      - quality_entry.py
      - quality_v2.py
      - requirements.txt
      - .github/workflows/auto-post.yml
  push:
    branches: [main]
    paths:
      - quality_gate.py
      - article_checks.py
      - tests/**
      - official_sources.py
      - quality_runner.py
      - quality_entry.py
      - quality_v2.py
      - requirements.txt
      - .github/workflows/auto-post.yml
  schedule:
    # 08:17 JST = 前日23:17 UTC。無料枠と品質監査を優先して1日1回。
    - cron: '17 23 * * *'

concurrency:
  group: hatena-auto-blog
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  write-and-publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Research, write, review and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}

          BLOG_THEME: ${{ vars.BLOG_THEME }}
          USE_GOOGLE_SEARCH: "false"
          RESEARCH_MODEL: "gemini-3.8-flash"
          WRITER_MODEL: "gemini-3.8-flash"
          CRITIC_MODEL: "gemini-3.8-flash"
          MAX_TOPIC_ATTEMPTS: "2"
          MAX_GEMINI_CALLS: "14"
          DRAFTS_PER_TOPIC: "3"

          HATENA_DRAFT: "false"
          DRY_RUN: "false"
        run: python quality_entry.py
